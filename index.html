<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="description" content="Orbit, organisation perso : tâches, rappels, devoirs Pronote, agenda et IA.">
<title>Orbit</title>
<link rel="canonical" href="https://prizmesportcontact-arch.github.io/Orbit/">
<meta property="og:title" content="Orbit">
<meta property="og:description" content="Organisation perso : cours, devoirs Pronote, tâches, bus et assistant IA.">
<meta property="og:image" content="https://prizmesportcontact-arch.github.io/Orbit/icons/icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="vendor/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgFx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side"><div class="rail">
    <div class="brand" title="Orbit"></div>
    <nav class="nav" id="sidenav" aria-label="Navigation principale"><div class="pill"></div></nav>
    <div class="foot" id="status"></div>
  </div></aside>
  <main class="main">
    <header class="top" id="top">
      <div><h1 id="title">Aujourd'hui</h1><div class="sub" id="date"></div></div>
      <div class="sp"></div>
      <div class="ribbon" id="ribbon" hidden></div>
      <div class="acts">
        <button class="iconbtn mobOnly" id="iaBtn" aria-label="Assistant IA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/></svg></button>
        <button class="iconbtn" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </header>
    <div class="capture">
      <form id="capForm" autocomplete="off">
        <input id="capIn" placeholder="Ajoute un truc ou pose une question…" enterkeyhint="send" aria-label="Ajouter ou demander">
        <button class="mic" id="capMic" type="button" aria-label="Dicter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="go" id="capGo" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter</span></button>
      </form>
      <div class="preview" id="preview"></div>
    </div>
    <div class="views" id="views">
      <section class="view" id="v-aujourdhui"></section>
      <section class="view" id="v-taches"></section>
      <section class="view" id="v-devoirs"></section>
      <section class="view" id="v-agenda"></section>
      <section class="view" id="v-bus"></section>
      <section class="view" id="v-ia"></section>
    </div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Onglets"><div class="pill"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panneau"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="offline" id="offline" role="status">Hors ligne · les changements seront envoyés plus tard</div>
<div class="gate" id="gate" role="region" aria-label="Connexion à Orbit" hidden>
  <form class="box" id="gateForm">
    <h1>Orbit<span style="color:var(--acc)">.</span></h1>
    <p>Entre ton code d'accès Orbit. Tu ne le feras qu'une fois par appareil.</p>
    <input class="inp" id="gateKey" placeholder="Code d'accès" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn p" type="submit">Entrer</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>
<script src="app.js" defer></script>
</body>
</html>
