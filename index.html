<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="description" content="Orbit — organisation perso : tâches, rappels, devoirs Pronote, agenda et IA.">
<title>Orbit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side"><div class="rail">
    <div class="brand" title="Orbit"></div>
    <nav class="nav" id="sidenav" aria-label="Navigation"><div class="pill"></div></nav>
    <div class="foot" id="status"></div>
  </div></aside>
  <main class="main">
    <header class="top" id="top">
      <div><h1 id="title">Aujourd'hui</h1><div class="sub" id="date"></div></div>
      <div class="sp"></div>
      <div class="acts">
        <button class="iconbtn mobOnly" id="iaBtn" aria-label="Assistant IA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/></svg></button>
        <button class="iconbtn" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </header>
    <div class="capture">
      <form id="capForm" autocomplete="off">
        <input id="capIn" placeholder="Note un truc à pas oublier… ex : inscription avant le 17" enterkeyhint="send" aria-label="Ajouter une tâche">
        <button class="go" id="capGo" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter</span></button>
      </form>
      <div class="preview" id="preview"></div>
    </div>
    <div class="views" id="views">
      <section class="view" id="v-aujourdhui"></section>
      <section class="view" id="v-taches"></section>
      <section class="view" id="v-devoirs"></section>
      <section class="view" id="v-agenda"></section>
      <section class="view" id="v-ia"></section>
    </div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation"><div class="pill"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="offline" id="offline">Hors ligne · les changements seront envoyés plus tard</div>
<div class="gate" id="gate" hidden>
  <form class="box" id="gateForm">
    <h1>Orbit<span style="color:var(--acc)">.</span></h1>
    <p>Entre ton code d'accès Orbit. Tu ne le feras qu'une fois par appareil.</p>
    <input class="inp" id="gateKey" placeholder="Code d'accès" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn p" type="submit">Entrer</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
